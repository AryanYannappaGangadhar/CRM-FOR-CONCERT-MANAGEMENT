{% extends 'base.html' %}
{% block title %}Login - EventBook Pro{% endblock %}
{% block content %}

<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg">
            <div class="card-header text-center py-4">
                <h3 class="mb-0"><i class="fas fa-sign-in-alt me-2"></i>Welcome Back</h3>
                <p class="mb-0 opacity-90 mt-1 small">Login to continue booking</p>
            </div>
            <div class="card-body p-4">
                <form method="POST" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-envelope text-primary"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-lock text-primary"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
                        <i class="fas fa-sign-in-alt me-1"></i> Login
                    </button>
                </form>

                <div class="bg-light rounded p-3 mt-4">
                    <h6 class="mb-2 text-muted"><i class="fas fa-info-circle me-1"></i> Demo Accounts:</h6>
                    <div class="small">
                        <div class="mb-1"><strong>Admin:</strong> admin@ticketbook.com / <code>admin123</code></div>
                        <div class="mb-1"><strong>Customer:</strong> rajesh@email.com / <code>rajesh123</code></div>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <p class="mb-0">Don't have an account?
                        <a href="{{ url_for('register') }}" class="fw-bold">Register Now</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
