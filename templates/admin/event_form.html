{% extends 'base.html' %}
{% block title %}{{ 'Edit' if event else 'Create' }} Event{% endblock %}
{% block content %}

<a href="{{ url_for('admin_events') }}" class="btn btn-outline-secondary mb-3">
    <i class="fas fa-arrow-left me-1"></i> Back to Events
</a>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-{{ 'edit' if event else 'plus' }} me-2"></i>{{ 'Edit' if event else 'Create New' }} Event</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" class="needs-validation" novalidate>
                    <div class="row g-3 mb-3">
                        <div class="col-md-12">
                            <label class="form-label">Event Name *</label>
                            <input type="text" name="event_name" class="form-control" required value="{{ event.event_name if event else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Event Date *</label>
                            <input type="date" name="event_date" class="form-control" required value="{{ event.event_date if event else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Event Time *</label>
                            <input type="time" name="event_time" class="form-control" required value="{{ event.event_time if event else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Venue *</label>
                            <select name="venue_id" class="form-select" required>
                                <option value="">-- Select Venue --</option>
                                {% for v in venues %}
                                <option value="{{ v.venue_id }}" {% if event and event.venue_id == v.venue_id %}selected{% endif %}>
                                    {{ v.venue_name }} ({{ v.total_capacity }} seats)
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Category *</label>
                            <select name="category" class="form-select" required>
                                {% for c in ['Concert','Conference','Sports','Theater','Workshop','Other'] %}
                                <option value="{{ c }}" {% if event and event.category == c %}selected{% endif %}>{{ c }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Status</label>
                            <select name="event_status" class="form-select">
                                {% for s in ['Draft','Published','Sold Out','Completed','Cancelled'] %}
                                <option value="{{ s }}" {% if event and event.event_status == s %}selected{% elif not event and s == 'Published' %}selected{% endif %}>{{ s }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Banner Image URL (optional)</label>
                            <input type="text" name="banner_image" class="form-control" value="{{ event.banner_image if event else '' }}">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="4" placeholder="Describe your event...">{{ event.description if event else '' }}</textarea>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('admin_events') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-save me-1"></i> {{ 'Update' if event else 'Create' }} Event
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
