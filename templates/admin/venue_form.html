{% extends 'base.html' %}
{% block title %}{{ 'Edit' if venue else 'Create' }} Venue{% endblock %}
{% block content %}

<a href="{{ url_for('admin_venues') }}" class="btn btn-outline-secondary mb-3">
    <i class="fas fa-arrow-left me-1"></i> Back to Venues
</a>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-{{ 'edit' if venue else 'plus' }} me-2"></i>{{ 'Edit' if venue else 'Create New' }} Venue</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" class="needs-validation" novalidate>
                    <div class="row g-3 mb-3">
                        <div class="col-md-12">
                            <label class="form-label">Venue Name *</label>
                            <input type="text" name="venue_name" class="form-control" required value="{{ venue.venue_name if venue else '' }}">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Full Address *</label>
                            <input type="text" name="address" class="form-control" required value="{{ venue.address if venue else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Total Capacity (Seats) *</label>
                            <input type="number" min="1" name="total_capacity" class="form-control" required value="{{ venue.total_capacity if venue else 500 }}">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Amenities</label>
                            <textarea name="amenities" class="form-control" rows="3" placeholder="Parking, AC, Food Court, WiFi, etc.">{{ venue.amenities if venue else '' }}</textarea>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('admin_venues') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-save me-1"></i> {{ 'Update' if venue else 'Create' }} Venue
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
