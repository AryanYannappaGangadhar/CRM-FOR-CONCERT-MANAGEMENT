{% extends 'base.html' %}
{% block title %}Register - EventBook Pro{% endblock %}
{% block content %}

<div class="row justify-content-center py-4">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg">
            <div class="card-header text-center py-4">
                <h3 class="mb-0"><i class="fas fa-user-plus me-2"></i>Create Account</h3>
                <p class="mb-0 opacity-90 mt-1 small">Join EventBook Pro today</p>
            </div>
            <div class="card-body p-4">
                <form method="POST" class="needs-validation" novalidate>
                    <div class="row g-3">
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-user text-primary"></i></span>
                                <input type="text" name="full_name" class="form-control" placeholder="John Doe" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-envelope text-primary"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-phone text-primary"></i></span>
                                <input type="tel" name="phone" class="form-control" placeholder="+91-9876543210" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-lock text-primary"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Min 6 characters" minlength="6" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-lock text-primary"></i></span>
                                <input type="password" name="password2" class="form-control" placeholder="Re-enter password" minlength="6">
                            </div>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Address (Optional)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-home text-primary"></i></span>
                                <input type="text" name="address" class="form-control" placeholder="123 Main Street, City">
                            </div>
                        </div>
                    </div>
                    <div class="mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" required id="terms">
                            <label class="form-check-label small text-muted" for="terms">
                                I agree to the Terms of Service and Privacy Policy
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
                        <i class="fas fa-user-plus me-1"></i> Create Account
                    </button>
                </form>
                <div class="text-center">
                    <p class="mb-0">Already have an account?
                        <a href="{{ url_for('login') }}" class="fw-bold">Login Here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
