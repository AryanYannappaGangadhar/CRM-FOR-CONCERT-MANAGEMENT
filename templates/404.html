{% extends 'base.html' %}
{% block title %}404 - Page Not Found{% endblock %}
{% block content %}

<div class="text-center py-5">
    <div style="font-size: 8rem; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; line-height: 1;">404</div>
    <h2 class="mb-3">Oops! Page Not Found</h2>
    <p class="text-muted mb-4">The page you are looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary btn-lg">
        <i class="fas fa-home me-2"></i> Go Back Home
    </a>
</div>

{% endblock %}
